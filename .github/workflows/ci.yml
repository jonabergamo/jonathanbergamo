name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm format:check
      - name: Palette guard (no stray hex colours in components)
        run: |
          if grep -rnE "#[0-9a-fA-F]{6}\b" src --include='*.tsx' --include='*.ts' \
            | grep -v "src/app/globals.css" \
            | grep -v "avatar-materials.ts" \
            | grep -v "avatar-fallback.tsx" \
            | grep -v "src/app/layout.tsx" \
            | grep -v "src/app/manifest.ts" \
            | grep -v "src/data/palettes.ts"; then
            echo "Hex colours belong in globals.css or the avatar materials."; exit 1; fi
      - run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
